<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ · __NAME__</title>
<meta name="description" content="__DESCRIPTION__">
<meta name="theme-color" id="theme-color" content="#14151a">
__THEME_BOOT__
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  __THEME_CSS__
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .topbar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .topbar-inner { display: flex; align-items: center; gap: 16px; max-width: 880px; margin: 0 auto; padding: 10px 24px; font-size: 14px; }
  .back { font-weight: 600; }
  .theme-toggle { margin-left: auto; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text-2); font-size: 12px; }
  .theme-toggle:hover { color: var(--text); background: var(--hover); }

  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 56px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; color: var(--text-3); font-size: 13px; margin-bottom: 24px; }
  .dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }

  .readme { overflow-wrap: anywhere; }
  .readme h1, .readme h2, .readme h3, .readme h4 { color: var(--heading); line-height: 1.3; font-weight: 650; margin: 1.8em 0 .6em; }
  .readme h1 { font-size: 30px; margin-top: 0; }
  .readme h2 { font-size: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .readme h3 { font-size: 18px; }
  .readme h4 { font-size: 16px; }
  .readme p, .readme ul, .readme ol, .readme blockquote, .readme pre, .readme markdown-accessiblity-table { margin: 0 0 1em; }
  .readme ul, .readme ol { padding-left: 1.6em; }
  .readme li + li { margin-top: .2em; }
  .readme blockquote { padding: 2px 16px; color: var(--text-2); border-left: 3px solid var(--line-strong); }
  .readme img { max-width: 100%; height: auto; vertical-align: middle; }
  .readme hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  .readme code { padding: .15em .35em; border-radius: 4px; background: var(--hover); font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .readme pre { padding: 14px 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--hover); line-height: 1.5; }
  .readme pre code { padding: 0; background: none; overflow-wrap: normal; }
  .readme .zeroclipboard-container, .readme .js-render-enrichment-loader { display: none; }
  .readme markdown-accessiblity-table { display: block; overflow-x: auto; }
  .readme table { border-collapse: collapse; font-size: 14px; line-height: 1.5; }
  .readme th, .readme td { padding: 8px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: normal; min-width: 88px; }
  .readme th { background: var(--hover); font-weight: 600; }
  .readme .katex-display { margin: .5em 0; padding: 4px 0; overflow-x: auto; overflow-y: hidden; }
  .readme pre[lang="mermaid"] { background: none; border: 0; padding: 0; text-align: center; }
  .readme pre[lang="mermaid"] svg { max-width: 100%; height: auto; }

  footer { border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; }
  .footer-inner { display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; max-width: 880px; margin: 0 auto;
                  padding: 24px 24px calc(28px + env(safe-area-inset-bottom)); }
  @media (max-width: 860px) {
    .topbar-inner { padding: 10px 16px; }
    .wrap { padding: 24px 16px 40px; }
    .readme h1 { font-size: 26px; }
    .footer-inner { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="back" href="/">← 知识图谱</a>
    <a href="__REPO_URL__">GitHub 仓库 ↗</a>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </div>
</header>
<div class="wrap">
  <p class="meta">
    <span class="dot" style="--c:var(--r-__REGION_ID__)"></span>
    <span>__REGION__</span><span>·</span><span>__LICENSE__</span><span>·</span><span>更新于 __UPDATED__</span>
  </p>
  <main class="readme">
__README__
  </main>
</div>
<footer>
  <div class="footer-inner">
    <span>© 2026 <a href="__GITHUB__">__NAME__</a></span>
    <span>内容来自仓库 README，license 以其仓库为准。</span>
  </div>
</footer>
<script>
__THEME_TOGGLE__
</script>
<script>
(function () {
  function load(src, done) {
    var script = document.createElement("script");
    script.src = src;
    script.onload = done;
    document.head.appendChild(script);
  }

  /* GitHub renders these two in the browser, so the API returns them as source. */
  var maths = document.querySelectorAll("math-renderer");
  if (maths.length) {
    load("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js", function () {
      maths.forEach(function (el) {
        el.style.display = "";
        var source = el.textContent.trim();
        var display = /^\$\$/.test(source) || el.classList.contains("js-display-math");
        source = source.replace(/^\${1,2}`?/, "").replace(/`?\${1,2}$/, "");
        window.katex.render(source, el, { displayMode: display, throwOnError: false });
      });
    });
  }

  var diagrams = Array.prototype.slice.call(document.querySelectorAll('pre[lang="mermaid"]'));
  if (!diagrams.length) return;
  diagrams.forEach(function (el) { el.dataset.source = el.textContent; });

  function renderDiagrams() {
    var latte = document.documentElement.getAttribute("data-theme") === "latte";
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: latte ? "neutral" : "dark" });
    diagrams.forEach(function (el) {
      el.removeAttribute("data-processed");
      el.textContent = el.dataset.source;
    });
    window.mermaid.run({ nodes: diagrams });
  }

  load("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js", function () {
    renderDiagrams();
    document.addEventListener("themechange", renderDiagrams);
  });
})();
</script>
</body>
</html>
